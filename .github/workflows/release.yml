name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: production-deploy

jobs:
  release:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get Latest Code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run Build
        run: |
          npm ci
          npm run build

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          # `wp package install` always registers the package's GitHub repo as
          # a Composer VCS source to resolve its tag, even for an
          # already-Packagist-published package — which needs a live GitHub
          # API call and fails under the runner's anonymous rate limit, and
          # a GITHUB_TOKEN doesn't fix it either (Composer's github-oauth
          # validator rejects Actions' newer ghs_-prefixed token format).
          # Installing straight from Packagist with plain Composer avoids
          # the GitHub API entirely.
          # Pinned: dist-archive-command's dev-main and v3.2.x require
          # wp-cli/wp-cli ^2.13/^3.0, neither of which is a released
          # stable core version yet (stable is 2.12.0) — v3.1.0 is the
          # newest tag that still only requires ^2.
          mkdir -p "$HOME/.wp-cli/packages"
          composer require --working-dir="$HOME/.wp-cli/packages" --no-interaction wp-cli/dist-archive-command:3.1.0

      - name: Package Theme
        run: |
          # wp dist-archive reads .distignore to strip dev-only files
          # (node_modules, src, package*.json, etc.) and wraps the result
          # in a single top-level folder — the same layout WordPress
          # expects when installing a theme zip.
          wp dist-archive . ./rehan-lodhi.zip
          mkdir -p ./dist
          unzip -q ./rehan-lodhi.zip -d ./dist
          echo "PACKAGE_DIR=$(find ./dist -mindepth 1 -maxdepth 1 -type d)" >> "$GITHUB_ENV"

      - name: Deploy to Production
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          RELEASES_ROOT: ${{ vars.PROD_RELEASES_ROOT }}
          THEME_LINK: ${{ vars.PROD_THEME_LINK }}
          KEEP_RELEASES: ${{ vars.PROD_KEEP_RELEASES }}
        run: |
          # 1. Start the SSH agent and add your private key
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -

          # 2. Create the .ssh directory just in case
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          RELEASE_DIR="${RELEASES_ROOT}/${GITHUB_REF_NAME}"

          # 3. Rsync the extracted, already-filtered package into its own
          #    tag-named release directory — never into the live theme path
          #    directly, so the site keeps serving the previous release
          #    until the symlink flips below.
          ssh -o StrictHostKeyChecking=no "${SSH_TARGET}" "mkdir -p '${RELEASE_DIR}'"
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            "${PACKAGE_DIR}/" "${SSH_TARGET}:${RELEASE_DIR}/"

          # 4. Atomically point wp-content/themes/rehan-lodhi at the new
          #    release, then prune old releases beyond KEEP_RELEASES —
          #    but never the one currently live, so a rollback target
          #    can't be pruned out from under a manual re-point.
          ssh -o StrictHostKeyChecking=no "${SSH_TARGET}" bash -s <<EOF
            set -euo pipefail

            THEME_LINK="${THEME_LINK}"
            RELEASES_ROOT="${RELEASES_ROOT}"
            RELEASE_DIR="${RELEASE_DIR}"
            KEEP_RELEASES="${KEEP_RELEASES}"

            # First run only: the live path is a real directory from the
            # original deploy.sh copy, not yet a symlink — move it aside
            # instead of deleting it.
            if [ -e "\${THEME_LINK}" ] && [ ! -L "\${THEME_LINK}" ]; then
              mv "\${THEME_LINK}" "\${THEME_LINK}.pre-release-backup"
            fi

            ln -sfn "\${RELEASE_DIR}" "\${THEME_LINK}"

            # Sort by tag (semver), not mtime — rsync -a carries the
            # source dir's timestamp over, so mtime doesn't reflect
            # deploy order. Whatever the symlink now points at is always
            # protected, even if it's an older tag from a rollback.
            cd "\${RELEASES_ROOT}"
            CURRENT="\$(basename "\$(readlink -f "\${THEME_LINK}")")"
            ls -1d */ 2>/dev/null | sed 's#/\$##' | sort -rV | tail -n "+\$((KEEP_RELEASES + 1))" | while read -r old; do
              [ "\${old}" != "\${CURRENT}" ] && rm -rf "\${old}"
            done
          EOF

          # 5. Kill the agent for clean exit
          ssh-agent -k
