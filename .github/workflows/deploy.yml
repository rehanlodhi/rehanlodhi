name: Publish Website

on:
  push:
    branches:
      - dev


jobs:
  web-deploy:
    name: 🚀 Deploy Website Every Commit
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get Latest Code
        uses: actions/checkout@v3

      - name: 📂 Sync Files
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: dev.rehanlodhi.com
          remote-user: rehanlodhi
          private-ssh-key: ${{ secrets.SSH_KEY }}
          destination-path: /home/sites/dev.rehanlodhi.com/public/wp-content/themes/rehan-lodhi